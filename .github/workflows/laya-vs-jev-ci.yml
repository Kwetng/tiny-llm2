name: laya-vs-jev-credit
on:
  push:
    paths: ["laya-vs-jev-credit/**", ".github/workflows/laya-vs-jev-ci.yml"]
  pull_request:
    paths: ["laya-vs-jev-credit/**"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: laya-vs-jev-credit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt bandit
      - run: bandit -q -r code
      - run: pytest -q tests          # no API key and no model weights needed
